name: Build pipa DEBUG
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - 'Common/**'
      - 'Platforms/**'
      - 'Silicon/**'
      - 'Resources/**'
      - 'Mu_Basecore'
      - 'Silicium-ACPI'
env:
  CI_BUILD: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup environment
        run: bash ./setup_env.sh -p apt

      - name: Build pipa (DEBUG)
        run: bash ./build_uefi.sh -d pipa -r DEBUG -c

      - name: Verify FD was built
        run: |
          fd=Build/pipaPkg/DEBUG_CLANGPDB/FV/SILICIUM_UEFI.fd
          test -s "$fd" || { echo "::error::FD missing"; exit 1; }
          ls -l "$fd" Mu-pipa* || true

      - name: Collect outputs
        run: |
          mkdir -p out
          cp Build/pipaPkg/DEBUG_CLANGPDB/FV/SILICIUM_UEFI.fd out/pipa-DEBUG.fd
          cp Mu-pipa* out/ || true

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: pipa-debug
          path: out/*
          if-no-files-found: error
          compression-level: 4
